apiVersion: apps/v1
kind: Deployment
metadata:
  name: production-app
  labels:
    app: production-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: production-app

  template:
    metadata:
      labels:
        app: production-app

    spec:
      containers:
      - name: production-app

        # Cloud Deploy replaces this image during deployment
        image: production-app

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"