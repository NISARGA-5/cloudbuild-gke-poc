steps:
# Build Docker image
- name: 'gcr.io/cloud-builders/docker'
  id: Build
  args:
    - build
    - -t
    - asia-south1-docker.pkg.dev/$PROJECT_ID/demo-repo/production-app:$SHORT_SHA
    - ./app

# Push Docker image
- name: 'gcr.io/cloud-builders/docker'
  id: Push
  args:
    - push
    - asia-south1-docker.pkg.dev/$PROJECT_ID/demo-repo/production-app:$SHORT_SHA

# Create Cloud Deploy Release
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  id: Create Release
  entrypoint: gcloud
  args:
    - deploy
    - releases
    - create
    - release-$BUILD_ID
    - --delivery-pipeline=production-pipeline
    - --region=asia-south1
    - --source=/workspace
    - --skaffold-file=skaffold.yaml
    - --images=production-app=asia-south1-docker.pkg.dev/$PROJECT_ID/demo-repo/production-app:$SHORT_SHA

images:
- asia-south1-docker.pkg.dev/$PROJECT_ID/demo-repo/production-app:$SHORT_SHA